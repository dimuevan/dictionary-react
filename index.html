<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#a543e8" />
    <meta
      name="description"
      content="Look up any English word: definitions, examples, synonyms and audio pronunciation."
    />
    <meta property="og:title" content="Dictionearch" />
    <meta
      property="og:description"
      content="Look up any English word: definitions, examples, synonyms and audio pronunciation."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dictionearch" />
    <!--
      Scrapers do not resolve relative URLs, so these have to be absolute — which
      means the deploy address is written down here as well as in vite.config.js.
      Change one and change the other. The image itself is generated by
      `npm run card`.
    -->
    <meta property="og:url" content="http://dev.iamevandimu.com/challenges/react/dictionearch/" />
    <meta
      property="og:image"
      content="http://dev.iamevandimu.com/challenges/react/dictionearch/social-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Dictionearch — a dictionary that keeps working when the dictionary does not."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- The one font file every first paint needs, fetched in parallel with the
         stylesheet instead of after it. -->
    <link
      rel="preload"
      href="/fonts/lora-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Dictionearch by iamevandimu.com</title>
  </head>
  <body>
    <!--
      The theme is a class on <body>, and React can only put it there after the
      first paint — so every load showed a white flash to anyone who had chosen
      dark. This runs before the browser paints anything.

      The keys and the defaults are the ones in src/usePreferences.js, which
      stays the authority: this only gets the first frame right.
    -->
    <script>
      (function () {
        var theme = 'light';
        var font = 'serif';
        try {
          var stored = localStorage.getItem('dictionearch-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';

          var storedFont = localStorage.getItem('dictionearch-font');
          if (storedFont === 'serif' || storedFont === 'sans' || storedFont === 'mono') {
            font = storedFont;
          }
        } catch (error) {
          // private mode, blocked site data: the defaults above still apply
        }
        document.body.className = theme + ' font-' + font;
      })();
    </script>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
