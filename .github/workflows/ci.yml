name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit:
    name: Tests and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          CI: true

      # The deploy subdirectory is baked into every asset path at build time,
      # and getting it wrong produces a page that loads and renders nothing.
      - name: Check the build would work where it is deployed
        run: npm run check:build

  browser:
    name: Browser checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The suite builds with VITE_BASE=/ and serves that from the root, rather
      # than from the subdirectory the real deploy lives in.
      - name: Run browser checks
        run: npm run e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
